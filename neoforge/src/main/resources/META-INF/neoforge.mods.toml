modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/Apollounknowndev/lithostitched/issues"
license = "MIT"

[[mods]]
    modId = "lithostitched"
    version = "${file.jarVersion}"
    displayName = "Lithostitched"
    logoFile = "pack.png"
    authors = "Apollo"
    credits = "SmellyModder, ebo2022"
    description = '''Library mod with new configurability and compatibility enhancements for worldgen.'''

[[mixins]]
config = "lithostitched.mixins.json"

[[mixins]]
config = "lithostitched.neoforge.mixins.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[dependencies.lithostitched]]
    modId = "minecraft"
    type = "required"
    versionRange = "[1.21.2,1.21.4)"
    ordering = "NONE"
    side = "BOTH"
